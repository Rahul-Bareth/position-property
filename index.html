<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position</title>
       <style>
        * {
           margin: 0;
           padding: 0;
        }  
        .box {
         border: 2px solid teal;
         height: 223px;
         width: 80vw;
         padding: 3px;
         margin: 3px;
        }

        .box1{
          background-color: rgb(22, 233, 233);
          position: sticky;
          top: 0px;
          margin: 0;
          padding: 0;
          width: 100%;
          /*position: absolute;
          top: 0px;*/
          
        }
        .box2{
          background-color: rgb(96, 137, 137);
         /*position: relative;
          top: -48px;
          left: 40px;
          z-index: 5;*/
        }
        .box3{
          background-color: rgb(247, 218, 180);
          /*position: fixed;
          bottom: 0px;
          left: 8vw;*/
        }
        .box4{
          background-color: rgb(226, 99, 226);
        }

        .parent {
          padding: 23px;
          margin: 43px;
          border: 2px solid orange;
          /*position: absolute;*/
        }
        
       </style>
</head>
<body>
  <div class="parent">
   <div class="box box1"></div>
   <div class="box box2"></div>
   <div class="box box3"></div>
   <div class="box box4"></div>
   </div>
</body>
</html>
